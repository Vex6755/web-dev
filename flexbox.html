<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Layout</title>
    <style>
      .card-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 24px;
        border: 2px solid #333;
        border-radius: 8px;
        max-width: 450px;
        margin: 50px auto;
        font-family: Arial, sans-serif;
      }

      .image-container {
        display: flex;
        flex-direction: row;
        gap: 12px;
      }

      .image-container img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border: 1px solid #999;
      }

      .title {
        font-size: 36px;
        font-weight: bold;
        margin: 0;
      }

      .description {
        font-size: 16px;
        text-align: center;
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card-container">
      <div class="image-container">
        <img src="images/mountain.jpeg" alt="Image 1" />
        <img src="images/bouddha.jpg" alt="Image 2" />
      </div>

      <h1 class="title">Michael is Great</h1>

      <p class="description">
        Michael is great. He is a skilled developer and always delivers
        high-quality work.
      </p>
    </div>
  </body>
</html>
