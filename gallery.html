<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <style>
      /* Centers all elements horizontally on the web page */
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 0;
      }

      .title {
        margin-top: 60px;
        margin-bottom: 30px;
        font-size: 2.5rem;
        color: #333;
        text-align: center;
      }

      .image-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        max-width: 950px;
        width: 90%;
        margin-bottom: 60px;
      }

      .image-container img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Images</h1>

    <!-- Centered Image Container (3 images per row, 8 total) -->
    <div class="image-container">
      <!-- Row 1 -->
      <img src="images/abc-trek.jpg" alt="ABC Trek Photo 1" />
      <img src="images/abc.png" alt="ABC Trek Photo 2" />
      <img src="images/example.png" alt="ABC Trek Photo 3" />

      <!-- Row 2 -->
      <img src="images/fb.png" alt="ABC Trek Photo 4" />
      <img src="images/abc-trek.jpg" alt="ABC Trek Photo 5" />
      <img src="images/abc.png" alt="ABC Trek Photo 6" />

      <!-- Row 3 (Contains exactly 2 images) -->
      <img src="images/fb.png" alt="ABC Trek Photo 7" />
      <img src="images/abc.png" alt="ABC Trek Photo 8" />
    </div>
  </body>
</html>
