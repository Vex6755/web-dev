<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABC Trek</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 0;
      }

      .title {
        margin-top: 60px;
        margin-bottom: 30px;
        font-size: 2.5rem;
        color: #333;
        text-align: center;
      }

      .trek-image {
        max-width: 80%;
        height: auto;
        border-radius: 8px;
        object-fit: contain;
        margin-bottom: 30px;
      }

      .description {
        max-width: 600px;
        text-align: center;
        font-size: 1.1rem;
        line-height: 1.6;
        color: #555;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <h1 class="title">ABC Trek</h1>

    <img
      class="trek-image"
      src="images/abc-trek.jpg"
      alt="ABC Trek Mountain View"
    />

    <p class="description">
      Embark on the legendary Annapurna Base Camp (ABC) trek. This journey takes
      you deep into the heart of the Himalayas, surrounded by towering peaks,
      vibrant rhododendron forests, and traditional Gurung villages.
    </p>
  </body>
</html>
