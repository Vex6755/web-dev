<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
      }

      .image-wrapper {
        display: grid;
        grid-template-columns: 1fr;
        gap: 15px;
        margin-top: 20px;
      }

      .image-wrapper img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 8px;
      }

      @media (min-width: 768px) {
        body {
          font-size: 20px;
          color: purple;
        }
        .image-wrapper {
          grid-template-columns: repeat(2, 1fr);
          gap: 20px;
        }
      }

      @media (min-width: 1200px) {
        body {
          font-size: 30px;
          color: aqua;
        }
        .image-wrapper {
          grid-template-columns: repeat(4, 1fr);
          gap: 25px;
        }
      }
    </style>
  </head>
  <body>
    <div class="image-wrapper">
      <img src="images/bouddha.jpg" alt="Image 1" />
      <img src="images/dhorpatan.jpg" alt="Image 2" />
      <img src="images/patan.webp" alt="Image 3" />
      <img src="images/mountain.jpeg" alt="Image 4" />
    </div>
  </body>
</html>
